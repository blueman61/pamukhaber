# Vercel'in ücretsiz planında cron günde bir kez çalışır. Bu iş akışı kaynakları
# günde 4 kez tarar. Repo ayarlarından SITE_URL ve CRON_SECRET sırlarını tanımlayın.
name: RSS taraması

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynakları tara
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL veya CRON_SECRET tanımlı değil, atlanıyor."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/ingest"
